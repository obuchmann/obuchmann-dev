<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 828" role="img" aria-labelledby="zl-t" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="zl-t">In what order it comes together</title><rect width="360" height="828" fill="#ffffff"/><rect x="0" y="6" width="360" height="24" rx="4" fill="#f2f4f6"/><text x="10" y="22" font-size="12.5" font-weight="700" fill="#1a1f24">Foundation</text><text x="350" y="22" font-size="11" fill="#5c6670" text-anchor="end">Sep 1 to Sep 8</text><line x1="70" y1="38" x2="70" y2="228" stroke="#c9d1d9" stroke-width="2"/><text x="58" y="50" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 1</text><circle cx="70" cy="46" r="5" fill="#0b6bcb"/><text x="84" y="50" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Ansible manages all hosts</tspan></text><text x="58" y="81" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 2</text><circle cx="70" cy="77" r="5" fill="#0b6bcb"/><text x="84" y="81" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Approval via Home Assistant,</tspan><tspan x="84" dy="15">push to the phone via ntfy</tspan></text><text x="58" y="127" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 6</text><circle cx="70" cy="123" r="5" fill="#0b6bcb"/><text x="84" y="127" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Secrets in SOPS</tspan></text><text x="58" y="158" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 7</text><circle cx="70" cy="154" r="5" fill="#0b6bcb"/><text x="84" y="158" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Central login (OIDC),</tspan><tspan x="84" dy="15">Forgejo as the first client</tspan></text><text x="58" y="204" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 8</text><circle cx="70" cy="200" r="5" fill="#0b6bcb"/><text x="84" y="204" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">First agent in CI:</tspan><tspan x="84" dy="15">checks the docs on every PR</tspan></text><rect x="0" y="242" width="360" height="24" rx="4" fill="#f2f4f6"/><text x="10" y="258" font-size="12.5" font-weight="700" fill="#1a1f24">Factory on one host</text><text x="350" y="258" font-size="11" fill="#5c6670" text-anchor="end">Sep 10 to Sep 23</text><line x1="70" y1="274" x2="70" y2="541" stroke="#c9d1d9" stroke-width="2"/><text x="58" y="286" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 10</text><circle cx="70" cy="282" r="5" fill="#0b6bcb"/><text x="84" y="286" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">The factory starts,</tspan><tspan x="84" dy="15">agents in containers on one host</tspan></text><text x="58" y="332" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 14</text><circle cx="70" cy="328" r="5" fill="#0b6bcb"/><text x="84" y="332" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Grafana and a log stack</tspan></text><text x="58" y="363" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 15</text><circle cx="70" cy="359" r="5" fill="#0b6bcb"/><text x="84" y="363" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Dashboards as code for the runs</tspan></text><text x="58" y="394" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 16</text><circle cx="70" cy="390" r="5" fill="#0b6bcb"/><text x="84" y="394" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Runner for Forgejo Actions</tspan></text><text x="58" y="425" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 18</text><circle cx="70" cy="421" r="5" fill="#0b6bcb"/><text x="84" y="425" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Switch to VictoriaLogs</tspan><tspan x="84" dy="15">and VictoriaMetrics</tspan></text><text x="58" y="471" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 20</text><circle cx="70" cy="467" r="5" fill="#0b6bcb"/><text x="84" y="471" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Kubernetes with Cilium and gVisor,</tspan><tspan x="84" dy="15">sandbox network tested</tspan></text><text x="58" y="517" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 21</text><circle cx="70" cy="513" r="5" fill="#0b6bcb"/><text x="84" y="517" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Flux for GitOps,</tspan><tspan x="84" dy="15">metrics and logs from the cluster</tspan></text><rect x="0" y="555" width="360" height="24" rx="4" fill="#f2f4f6"/><text x="10" y="571" font-size="12.5" font-weight="700" fill="#1a1f24">Factory in the cluster</text><text x="350" y="571" font-size="11" fill="#5c6670" text-anchor="end">Sep 26 to Oct 16</text><line x1="70" y1="587" x2="70" y2="808" stroke="#c9d1d9" stroke-width="2"/><text x="58" y="599" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Sep 26</text><circle cx="70" cy="595" r="5" fill="#0b6bcb"/><text x="84" y="599" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Controller in the cluster,</tspan><tspan x="84" dy="15">first agent jobs under gVisor</tspan></text><text x="58" y="645" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Oct 2</text><circle cx="70" cy="641" r="5" fill="#0b6bcb"/><text x="84" y="645" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Second repo, two runs in parallel</tspan></text><text x="58" y="676" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Oct 4</text><circle cx="70" cy="672" r="5" fill="#0b6bcb"/><text x="84" y="676" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">First product as an app in the cluster</tspan></text><text x="58" y="707" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Oct 6</text><circle cx="70" cy="703" r="5" fill="#0b6bcb"/><text x="84" y="707" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">LiteLLM as the gateway</tspan><tspan x="84" dy="15">for all model calls</tspan></text><text x="58" y="753" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Oct 7</text><circle cx="70" cy="749" r="5" fill="#0b6bcb"/><text x="84" y="753" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Trace view with Phoenix</tspan></text><text x="58" y="784" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">Oct 16</text><circle cx="70" cy="780" r="5" fill="#0b6bcb"/><text x="84" y="784" font-size="12" fill="#1a1f24" font-weight="700"><tspan x="84" dy="0">Kill switch: parallelism to 0,</tspan><tspan x="84" dy="15">the factory is frozen</tspan></text></svg>
