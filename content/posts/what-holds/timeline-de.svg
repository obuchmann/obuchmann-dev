<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 828" role="img" aria-labelledby="zl-t" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="zl-t">Was in welcher Reihenfolge entsteht</title><rect width="360" height="828" fill="#ffffff"/><rect x="0" y="6" width="360" height="24" rx="4" fill="#f2f4f6"/><text x="10" y="22" font-size="12.5" font-weight="700" fill="#1a1f24">Fundament</text><text x="350" y="22" font-size="11" fill="#5c6670" text-anchor="end">01.09. bis 08.09.</text><line x1="70" y1="38" x2="70" y2="228" stroke="#c9d1d9" stroke-width="2"/><text x="58" y="50" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">01.09.</text><circle cx="70" cy="46" r="5" fill="#0b6bcb"/><text x="84" y="50" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Ansible verwaltet alle Hosts</tspan></text><text x="58" y="81" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">02.09.</text><circle cx="70" cy="77" r="5" fill="#0b6bcb"/><text x="84" y="81" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Freigabe per Home Assistant,</tspan><tspan x="84" dy="15">Push aufs Handy per ntfy</tspan></text><text x="58" y="127" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">06.09.</text><circle cx="70" cy="123" r="5" fill="#0b6bcb"/><text x="84" y="127" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Secrets in SOPS</tspan></text><text x="58" y="158" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">07.09.</text><circle cx="70" cy="154" r="5" fill="#0b6bcb"/><text x="84" y="158" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Zentraler Login (OIDC),</tspan><tspan x="84" dy="15">Forgejo als erster Client</tspan></text><text x="58" y="204" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">08.09.</text><circle cx="70" cy="200" r="5" fill="#0b6bcb"/><text x="84" y="204" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Erster Agent im CI:</tspan><tspan x="84" dy="15">prüft die Doku bei jedem PR</tspan></text><rect x="0" y="242" width="360" height="24" rx="4" fill="#f2f4f6"/><text x="10" y="258" font-size="12.5" font-weight="700" fill="#1a1f24">Factory auf einem Host</text><text x="350" y="258" font-size="11" fill="#5c6670" text-anchor="end">10.09. bis 23.09.</text><line x1="70" y1="274" x2="70" y2="541" stroke="#c9d1d9" stroke-width="2"/><text x="58" y="286" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">10.09.</text><circle cx="70" cy="282" r="5" fill="#0b6bcb"/><text x="84" y="286" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Die Factory startet,</tspan><tspan x="84" dy="15">Agents in Containern auf einem Host</tspan></text><text x="58" y="332" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">14.09.</text><circle cx="70" cy="328" r="5" fill="#0b6bcb"/><text x="84" y="332" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Grafana und Log-Stack</tspan></text><text x="58" y="363" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">15.09.</text><circle cx="70" cy="359" r="5" fill="#0b6bcb"/><text x="84" y="363" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Dashboards als Code für die Läufe</tspan></text><text x="58" y="394" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">16.09.</text><circle cx="70" cy="390" r="5" fill="#0b6bcb"/><text x="84" y="394" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Runner für Forgejo Actions</tspan></text><text x="58" y="425" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">18.09.</text><circle cx="70" cy="421" r="5" fill="#0b6bcb"/><text x="84" y="425" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Umstieg auf VictoriaLogs</tspan><tspan x="84" dy="15">und VictoriaMetrics</tspan></text><text x="58" y="471" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">20.09.</text><circle cx="70" cy="467" r="5" fill="#0b6bcb"/><text x="84" y="471" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Kubernetes mit Cilium und gVisor,</tspan><tspan x="84" dy="15">Sandbox-Netz getestet</tspan></text><text x="58" y="517" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">21.09.</text><circle cx="70" cy="513" r="5" fill="#0b6bcb"/><text x="84" y="517" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Flux für GitOps,</tspan><tspan x="84" dy="15">Metriken und Logs aus dem Cluster</tspan></text><rect x="0" y="555" width="360" height="24" rx="4" fill="#f2f4f6"/><text x="10" y="571" font-size="12.5" font-weight="700" fill="#1a1f24">Factory im Cluster</text><text x="350" y="571" font-size="11" fill="#5c6670" text-anchor="end">26.09. bis 16.10.</text><line x1="70" y1="587" x2="70" y2="808" stroke="#c9d1d9" stroke-width="2"/><text x="58" y="599" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">26.09.</text><circle cx="70" cy="595" r="5" fill="#0b6bcb"/><text x="84" y="599" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Controller im Cluster,</tspan><tspan x="84" dy="15">erste Agent-Jobs unter gVisor</tspan></text><text x="58" y="645" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">02.10.</text><circle cx="70" cy="641" r="5" fill="#0b6bcb"/><text x="84" y="645" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Zweites Repo, zwei Läufe parallel</tspan></text><text x="58" y="676" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">04.10.</text><circle cx="70" cy="672" r="5" fill="#0b6bcb"/><text x="84" y="676" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Erstes Produkt als App im Cluster</tspan></text><text x="58" y="707" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">06.10.</text><circle cx="70" cy="703" r="5" fill="#0b6bcb"/><text x="84" y="707" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">LiteLLM als Gateway</tspan><tspan x="84" dy="15">für alle Modellaufrufe</tspan></text><text x="58" y="753" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">07.10.</text><circle cx="70" cy="749" r="5" fill="#0b6bcb"/><text x="84" y="753" font-size="12" fill="#1a1f24"><tspan x="84" dy="0">Trace-Ansicht mit Phoenix</tspan></text><text x="58" y="784" font-size="12" font-weight="700" fill="#1a1f24" text-anchor="end">16.10.</text><circle cx="70" cy="780" r="5" fill="#0b6bcb"/><text x="84" y="784" font-size="12" fill="#1a1f24" font-weight="700"><tspan x="84" dy="0">Not-Aus: parallelism auf 0,</tspan><tspan x="84" dy="15">die Factory ist eingefroren</tspan></text></svg>
