baseURL = "https://obuchmann.dev/"
title = "obuchmann.dev"
timeZone = "Europe/Vienna"
enableRobotsTXT = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[params]
author = "Oliver Buchmann"

# Cookieless hit counting via GoatCounter (https://<code>.goatcounter.com).
# Only injected in production builds. Empty string disables it.
[params.analytics]
goatcounter = "obuchmann"

[pagination]
pagerSize = 20

[taxonomies]
tag = "tags"

[outputs]
home = ["HTML", "RSS"]

[markup.goldmark.renderer]
unsafe = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[languages]

  [languages.en]
  languageName = "English"
  languageCode = "en-us"
  weight = 1

    [languages.en.params]
    description = "I write to think — ideas and observations on software architecture, agentic engineering, and how knowledge moves through organizations."
    headline = "Thoughts in progress."
    tagline = "I write to think — about software architecture, agentic engineering, and how knowledge moves through organizations. Nothing here claims to be right; everything here is an invitation to disagree."

    [[languages.en.menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 5

    [[languages.en.menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10

    [[languages.en.menus.main]]
    name = "GitHub"
    url = "https://github.com/obuchmann/obuchmann-dev"
    weight = 30

    [[languages.en.menus.main]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/oliver-buchmann/"
    weight = 40

  [languages.de]
  languageName = "Deutsch"
  languageCode = "de"
  weight = 2

    [languages.de.params]
    description = "Ich schreibe, um zu denken — Ideen und Beobachtungen zu Softwarearchitektur, agentic engineering und wie Wissen sich in Organisationen bewegt."
    headline = "Gedanken in Arbeit."
    tagline = "Ich schreibe, um zu denken — über Softwarearchitektur, agentic engineering und wie Wissen sich in Organisationen bewegt. Nichts hier beansprucht, richtig zu sein; alles hier ist eine Einladung zum Widerspruch."

    [[languages.de.menus.main]]
    name = "Über mich"
    pageRef = "/about"
    weight = 5

    [[languages.de.menus.main]]
    name = "Beiträge"
    pageRef = "/posts"
    weight = 10

    [[languages.de.menus.main]]
