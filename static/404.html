<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>404 · obuchmann.dev</title>
<script>
  (function () {
    var path = window.location.pathname;
    if (!/^\/(en|de)(\/|$)/.test(path)) {
      window.location.replace("/en" + path + window.location.search + window.location.hash);
    }
  })();
</script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1f24;
    --muted: #5c6670;
    --accent: #0b6bcb;
    --accent-hover: #084e94;
    --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c;
      --fg: #e6e9ec;
      --muted: #9aa4ae;
      --accent: #6cb2f7;
      --accent-hover: #9dcbfa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1.125rem;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 42rem;
    margin: 0 auto;
    padding: 4rem 1.25rem;
  }
  h1 { margin: 0 0 0.5rem; }
  p.subtitle { color: var(--muted); margin: 0 0 2rem; }
  a { color: var(--accent); text-decoration: underline; text-underline-offset: 0.15em; }
  a:hover { color: var(--accent-hover); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p class="subtitle" data-i18n="notFoundTitle">This page doesn't exist.</p>
    <p><a href="/en/" data-i18n-href="home" data-i18n="backToHome">Back to the front page</a></p>
  </div>
  <script>
    if (window.location.pathname.match(/^\/de(\/|$)/)) {
      document.documentElement.lang = "de";
      document.title = "404 · obuchmann.dev";
      document.querySelector('[data-i18n="notFoundTitle"]').textContent = "Diese Seite gibt es nicht.";
      var home = document.querySelector('[data-i18n="backToHome"]');
      home.textContent = "Zurück zur Startseite";
      home.setAttribute("href", "/de/");
    }
  </script>
</body>
</html>
