name = "obuchmann-dev-root-redirect"
main = "src/index.js"
compatibility_date = "2024-11-01"

# account_id is intentionally not hardcoded here - it is not secret, but
# leaving it out lets wrangler pick it up from the CLOUDFLARE_ACCOUNT_ID
# environment variable (set in CI and locally) so this file has nothing
# account-specific to keep in sync. See README.md in this directory.

routes = [
  # Wildcard: the Worker needs to see every request to catch old unprefixed
  # URLs anywhere on the site, not just "/". src/index.js passes through
  # anything that is already under /de or /en, or looks like a static file.
  { pattern = "obuchmann.dev/*", zone_name = "obuchmann.dev" }
]
